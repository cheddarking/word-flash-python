[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordflash-python"
version = "0.1.0"
description = "A Windows tray app that displays KJV verses over the desktop"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.8,<1"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
wordflash = "wordflash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wordflash.data" = ["verses.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
